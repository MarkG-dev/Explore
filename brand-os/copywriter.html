<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copywriter · Brand OS</title>
<link rel="stylesheet" href="/brand-os/style.css">
</head>
<body>
<div class="sc-page">
  <header class="sc-topbar">
    <div class="left"><span class="sc-wordmark">Spacecadet Studio<span class="plus">+</span></span></div>
    <div class="center" id="brandTag">— · copywriter</div>
    <div class="right sc-meta-lines">NYC, Planet Earth
<span class="sc-clock">00:00:00</span></div>
  </header>

  <main style="align-self: center; max-width: 1200px; width: 100%; display: flex; flex-direction: column; gap: var(--space-6);">
    <div>
      <div class="sc-tag"><span class="num">01</span> Locked to your voice</div>
      <h1 class="sc-h1" style="margin-top: 6px;">Copywriter</h1>
    </div>

    <div class="sc-grid-2">
      <div class="sc-card" style="gap: var(--space-4);">
        <div class="sc-eyebrow">Source</div>
        <div class="sc-field">
          <textarea id="source" placeholder="Paste the text to rewrite — a headline, a paragraph, a raw idea."></textarea>
        </div>
        <div>
          <div class="sc-eyebrow" style="margin-bottom: 8px;">Task</div>
          <div class="sc-navrow" id="presets"></div>
        </div>
        <div class="sc-row" style="justify-content: space-between;">
          <div class="sc-row">
            <button class="sc-pill solid" id="go">Rewrite →</button>
            <button class="sc-pill mono small" id="clear">Clear</button>
          </div>
          <span class="sc-status" id="status"></span>
        </div>
      </div>

      <div class="sc-card" style="gap: var(--space-4);">
        <div class="sc-eyebrow">Result</div>
        <div id="output" class="sc-field" style="min-height: 320px; flex: 1; border: var(--border-thin) solid var(--sc-hairline); border-radius: var(--radius-sm); padding: 16px; white-space: pre-wrap; line-height: 1.55; font-family: var(--font-display); color: var(--sc-ink);">
          <span class="sc-eyebrow">Waiting for input</span>
        </div>
        <div class="sc-row">
          <button class="sc-pill mono small" id="copy" disabled>Copy</button>
          <button class="sc-pill mono small" id="reroll" disabled>Reroll</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="sc-botbar">
    <div class="left"><a href="#" id="backLink" class="sc-pill small mono">← Workshop</a></div>
    <div class="center"></div>
    <div class="right"><a href="#" id="logout" class="sc-pill small mono">Sign out</a></div>
  </footer>
</div>

<script src="/brand-os/starfield.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  document.getElementById('backLink').href = `/brand-os/brand?slug=${encodeURIComponent(slug || '')}`;

  let activePreset = null;

  (async () => {
    if (!slug) { location.href = '/brand-os/login'; return; }
    const r = await fetch('/api/brand-os/session', { credentials: 'same-origin' });
    if (!r.ok) { location.href = `/brand-os/login?next=${encodeURIComponent(location.pathname + location.search)}`; return; }
    const me = await r.json();
    document.getElementById('brandTag').textContent = `${(me.name || slug).toUpperCase()} · COPYWRITER`;

    const presets = ['Tighten', 'Rewrite as tagline', 'Headline', 'Explain simply'];
    const wrap = document.getElementById('presets');
    presets.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'sc-pill mono small';
      b.textContent = p;
      b.onclick = () => {
        activePreset = p;
        wrap.querySelectorAll('.sc-pill').forEach(el => el.classList.remove('active'));
        b.classList.add('active');
      };
      if (i === 0) b.click();
      wrap.appendChild(b);
    });
  })();

  document.getElementById('go').addEventListener('click', async () => {
    const source = document.getElementById('source').value.trim();
    const status = document.getElementById('status');
    const out = document.getElementById('output');
    if (!source) { status.className = 'sc-status err'; status.textContent = 'Give it something to work with.'; return; }
    status.className = 'sc-status'; status.textContent = 'Rewriting…';
    out.textContent = '';
    document.getElementById('copy').disabled = true;
    document.getElementById('reroll').disabled = true;
    try {
      const r = await fetch('/api/brand-os/copywriter', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ slug, source, presetLabel: activePreset }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Failed');
      out.textContent = j.output;
      status.className = 'sc-status ok'; status.textContent = 'Done.';
      document.getElementById('copy').disabled = false;
      document.getElementById('reroll').disabled = false;
    } catch (e) {
      status.className = 'sc-status err'; status.textContent = e.message;
      out.innerHTML = '<span class="sc-eyebrow">Waiting for input</span>';
    }
  });

  document.getElementById('clear').addEventListener('click', () => {
    document.getElementById('source').value = '';
    document.getElementById('output').innerHTML = '<span class="sc-eyebrow">Waiting for input</span>';
    document.getElementById('status').textContent = '';
  });
  document.getElementById('copy').addEventListener('click', () => {
    navigator.clipboard.writeText(document.getElementById('output').textContent);
    const s = document.getElementById('status');
    s.className = 'sc-status ok'; s.textContent = 'Copied.';
  });
  document.getElementById('reroll').addEventListener('click', () => document.getElementById('go').click());
  document.getElementById('logout').addEventListener('click', async (e) => {
    e.preventDefault();
    await fetch('/api/brand-os/session', { method: 'DELETE', credentials: 'same-origin' });
    location.href = '/brand-os';
  });
</script>
</body>
</html>
