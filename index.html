<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Homesick — Explore</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 420px;
      width: 100%;
      padding: 0 24px;
    }

    .brand {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 24px;
    }

    .title {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 48px;
    }

    .title span { color: #555; }

    .links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #f0f0f0;
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      transition: all 0.15s;
    }

    .link:hover {
      background: #1a1a1a;
      border-color: #444;
    }

    .link:active { transform: scale(0.99); }

    .link-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .link-sub {
      font-size: 11px;
      color: #555;
      font-weight: 400;
    }

    .link-arrow {
      color: #555;
      font-size: 16px;
    }

    .footer {
      margin-top: 64px;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">Homesick</div>
    <div class="title">Explore <span>tools</span></div>

    <div class="links">
      <a href="/wifi" class="link">
        <div class="link-label">
          WiFi Connect
          <span class="link-sub">NFC device provisioning</span>
        </div>
        <span class="link-arrow">&rarr;</span>
      </a>
      <a href="/lifetracker" class="link">
        <div class="link-label">
          Life Tracker
          <span class="link-sub">Visualize your time</span>
        </div>
        <span class="link-arrow">&rarr;</span>
      </a>
      <a href="/arena" class="link">
        <div class="link-label">
          Arena
          <span class="link-sub">Twin-stick top-down action</span>
        </div>
        <span class="link-arrow">&rarr;</span>
      </a>
    </div>

    <div class="footer">Objects for elsewhere</div>
  </div>
</body>
</html>
