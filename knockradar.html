<script>
  const stage=document.getElementById('stage');
  const NAMES={radar:['Radar','dark, animated, data-forward'],signal:['Signal','editorial, premium, understated'],

    territory:['Territory','map-first, scarcity &amp; ownership']};
  function show(d){
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
    document.getElementById('dname').textContent=NAMES[d][0];
    document.querySelector('.meta').innerHTML='<b id="dname">'+NAMES[d][0]+'</b> — '+NAMES[d][1];
    stage.srcdoc=document.getElementById('d-'+d).innerHTML;
  }
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.d));
