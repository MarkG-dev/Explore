name: Permit-lead daily pipeline

# Runs the Berkshire permit-lead pipeline daily: scrape -> classify -> score ->
# route arms -> export the contractor-app data (permitleads-data.json), then
# commit the refreshed JSON so Vercel redeploys with today's leads.
#
# NOTE: The `fixture` source runs anywhere with no secrets (good for verifying
# the workflow). To go live, switch --source to permiteyes_berkshire AND either
# run Playwright here or point at your own scraper host; the live portal needs a
# browser context. Set ANTHROPIC_API_KEY as a repo secret to use the LLM
# classifier instead of the rules fallback.

on:
  schedule:
    - cron: "0 11 * * *"      # 07:00 America/New_York (permits post overnight)
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      source:
        description: "Source id from config/sources.yaml (fixture|permiteyes_berkshire|cambridge|boston)"
        default: fixture
      mode:
        description: "run (full pipeline) or inspect (confirm columns/selectors)"
        default: run
        type: choice
        options: [run, inspect]

permissions:
  contents: write              # to commit the refreshed data JSON

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: permit-lead-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install Playwright (only needed for portal sources)
        if: contains(github.event.inputs.source, 'permiteyes')
        run: pip install playwright && python -m playwright install --with-deps chromium

      - name: Test pipeline
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q

      # Inspect mode: confirm live columns/selectors for a source (network is open here).
      - name: Inspect source
        if: github.event.inputs.mode == 'inspect'
        env:
          PYTHONPATH: src
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python -m permitlead.inspect_source "${{ github.event.inputs.source }}" --sample 3

      - name: Run pipeline + export web data
        if: github.event.inputs.mode != 'inspect'
        env:
          PYTHONPATH: src
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # uncomment to use LLM
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          SOURCE: ${{ github.event.inputs.source || 'fixture' }}
        run: |
          python -m permitlead.seed_contractors --db data/permits.db
          python -m permitlead.run_daily --source "$SOURCE" --db data/permits.db --out out/
          python -m permitlead.export_web --db data/permits.db --out ../permitleads-data.json
          python -m permitlead.export_status --db data/permits.db --out ../sources-status.json

      - name: Commit refreshed leads (if changed)
        if: github.event.inputs.mode != 'inspect'
        run: |
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- permitleads-data.json sources-status.json; then
            git config user.name "permitpulse-bot"
            git config user.email "actions@github.com"
            git add permitleads-data.json sources-status.json
            git commit -m "chore: refresh permit leads + source status ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes today."
          fi
