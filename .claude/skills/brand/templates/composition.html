<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{BRAND}} — {{SHOT}}</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; min-height: 100vh; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: #f0f0f0;
  }
  .stage {
    position: relative;
    width: min(96vw, 1200px);
    aspect-ratio: {{ASPECT}};
    overflow: hidden;
    border-radius: 4px;
    container-type: inline-size;
    background: #111;
  }
  .stage > img.base {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .el {
    position: absolute;
    pointer-events: none;
    white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    line-height: 1;
  }
  .el.shape-circle, .el.shape-pill {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-shadow: none;
  }
  .el.shape-circle { border-radius: 50%; }
  .el.shape-pill { border-radius: 999px; }

  .meta {
    margin-top: 20px;
    max-width: min(96vw, 1200px);
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    color: #666;
  }
  .meta a { color: #999; text-decoration: none; }
</style>
</head>
<body>
  <div class="stage">
    <img class="base" src="{{BASE_URL}}" alt="">
    <!-- ELEMENTS -->
{{ELEMENTS_HTML}}
  </div>
  <div class="meta">
    <span>{{BRAND}}</span>
    <a href="./index.html">index →</a>
  </div>
</body>
</html>
