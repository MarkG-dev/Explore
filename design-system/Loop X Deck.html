  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

font-display: swap;\n  src: url(\"ca2d1a37-68fe-4aaa-8a45-563e7baf34a7\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"81acb257-1817-40de-88c3-e988c64ce7f6\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a8504ce2-d47c-4f8c-85f9-be4b2bc7f4d3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ------------------------------------------------------------------\n   Loop X — Color tokens\n   A minimal, high-contrast, monochrome palette. High contrast drives\n   brand recognition; grey provides structure; off-white aids\n   readability. Red exists only as a rare technical stroke accent.\n------------------------------------------------------------------ */\n:root {\n  /* --- Base palette (exact source values) --- */\n  --lx-black:      rgb(0, 0, 0);        /* #000000 — primary */\n  --lx-white:      rgb(255, 255, 255);  /* #FFFFFF */\n  --lx-off-white:  rgb(247, 247, 247);  /* #F7F7F7 — light surfaces / on-dark text */\n  --lx-grey:       rgb(196, 196, 196);  /* #C4C4C4 — structural neutral */\n  --lx-grey-deck:  rgb(56, 56, 56);     /* #383838 — deck/backing grey */\n  --lx-ink-20:     rgba(0, 0, 0, 0.2);  /* hairline rules on light */\n  --lx-signal:     rgb(255, 0, 0);      /* #FF0000 — technical stroke accent, rare */\n\n  /* --- Semantic: surfaces --- */\n  --surface-primary:   var(--lx-black);      /* default brand ground */\n  --surface-inverse:   var(--lx-white);\n  --surface-muted:     var(--lx-off-white);  /* readable light panels */\n  --surface-structure: var(--lx-grey);       /* grey framing blocks */\n  --surface-backing:   var(--lx-grey-deck);  /* deck backing / matting */\n\n  /* --- Semantic: text --- */\n  --text-on-dark:      var(--lx-off-white);\n  --text-on-light:     var(--lx-black);\n  --text-muted-dark:   rgba(247, 247, 247, 0.6);\n  --text-muted-light:  rgba(0, 0, 0, 0.55);\n\n  /* --- Semantic: lines & borders --- */\n  --border-on-light:   var(--lx-black);\n  --border-on-dark:    var(--lx-off-white);\n  --hairline-light:    var(--lx-ink-20);\n  --hairline-dark:     rgba(247, 247, 247, 0.25);\n}\n\n/* ------------------------------------------------------------------\n   Loop X — Typography tokens\n   Aeonik (primary): headlines, titles, body — the vast majority of\n   communication. DM Mono (secondary): eyebrows, labels, links,\n   technical detail, UI. Headlines set UPPERCASE, tight leading;\n   body sentence case; mono UPPERCASE for labels.\n------------------------------------------------------------------ */\n:root {\n  /* --- Families --- */\n  --font-primary: \"Hanken Grotesk\", \"Aeonik\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Arial, sans-serif;\n  --font-mono: \"DM Mono\", ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* --- Weights --- */\n  --fw-light: 300;   /* @kind font */\n  --fw-regular: 400; /* @kind font */\n  --fw-medium: 500;  /* @kind font */\n\n  /* --- Type scale (px, from source) --- */\n  --fs-display: 75px;   /* cover / brand universe */\n  --fs-h1: 44px;        /* hero headline */\n  --fs-h2: 35px;        /* section headline */\n  --fs-h3: 26px;        /* strategy blocks / large body */\n  --fs-title: 41px;     /* page title (guideline sidebar) */\n  --fs-lead: 30px;      /* introduction / lead body */\n  --fs-body: 18px;      /* body copy */\n  --fs-body-sm: 14px;\n  --fs-label: 12px;     /* mono eyebrow / label / caption */\n  --fs-link: 16px;      /* mono link */\n\n  /* --- Line heights --- */\n  --lh-headline: 0.9;   /* @kind font */\n  --lh-tight: 1.0;      /* @kind font */\n  --lh-body: 1.19;      /* @kind font */\n  --lh-label: 1.25;     /* @kind font */\n\n  /* --- Tracking --- */\n  --tracking-tight: -0.01em;\n  --tracking-normal: 0;\n  --tracking-label: 0.02em;\n}\n\n/* ------------------------------------------------------------------\n   Type role utility classes — apply the Loop X hierarchy directly.\n------------------------------------------------------------------ */\n.lx-display {\n  font-family: var(--font-primary);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-display);\n  line-height: var(--lh-headline);\n  letter-spacing: var(--tracking-tight);\n  text-transform: uppercase;\n}\n.lx-h1 {\n  font-family: var(--font-primary);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-h1);\n  line-height: var(--lh-headline);\n  letter-spacing: var(--tracking-tight);\n  text-transform: uppercase;\n}\n.lx-h2 {\n  font-family: var(--font-primary);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-h2);\n  line-height: var(--lh-headline);\n  text-transform: uppercase;\n}\n.lx-h3 {\n  font-family: var(--font-primary);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-h3);\n  line-height: var(--lh-tight);\n}\n.lx-title {\n  font-family: var(--font-primary);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-title);\n  line-height: var(--lh-tight);\n}\n.lx-lead {\n  font-family: var(--font-primary);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-lead);\n  line-height: var(--lh-body);\n}\n.lx-body {\n  font-family: var(--font-primary);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n}\n.lx-label {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-label);\n  line-height: var(--lh-label);\n  letter-spacing: var(--tracking-label);\n  text-transform: uppercase;\n}\n.lx-link {\n  font-family: var(--font-mono);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-link);\n  line-height: var(--lh-label);\n  text-transform: uppercase;\n}\n\n/* ------------------------------------------------------------------\n   Loop X — Spacing, layout & geometry tokens\n   The system is built on a wide document grid: 50px page margins, a\n   fixed label/sidebar column and a large content column. The\n   signature shape is the chamfered (\"cut corner\") rectangle, echoing\n   the notched geometry of the LOOP X letterforms.\n------------------------------------------------------------------ */\n:root {\n  /* --- Spacing scale --- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n\n  /* --- Document grid (scaled from the 1920px source canvas) --- */\n  --page-margin: 50px;    /* outer margin on all sides */\n  --sidebar-col: 471px;   /* label / title column */\n  --grid-gutter: 20px;    /* column gutter */\n\n  /* --- Geometry --- */\n  --chamfer: 7px;         /* signature cut-corner size (buttons/labels) */\n  --chamfer-lg: 14px;     /* larger panels */\n  --radius-none: 0px;     /* the system is overwhelmingly square */\n  --radius-panel: 15px;   /* rare — used on some framed light panels */\n\n  /* --- Borders --- */\n  --border-hair: 0.5px;   /* guideline hairlines */\n  --border-thin: 1px;\n  --border-med: 1.3px;    /* button outlines */\n\n  /* --- Motion --- */\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-med: 220ms; /* @kind other */\n}\n\n/* Signature chamfered-corner clip. Apply to any box for the Loop X\n   cut-corner silhouette. Corner size follows --chamfer by default;\n   override with `--chamfer:` on the element. */\n.lx-chamfer {\n  clip-path: polygon(\n    var(--chamfer) 0,\n    calc(100% - var(--chamfer)) 0,\n    100% var(--chamfer),\n    100% calc(100% - var(--chamfer)),\n    calc(100% - var(--chamfer)) 100%,\n    var(--chamfer) 100%,\n    0 calc(100% - var(--chamfer)),\n    0 var(--chamfer)\n  );\n}\n\n/* ------------------------------------------------------------------\n   Loop X — Base resets & link defaults\n   Minimal, so the monochrome system reads cleanly everywhere.\n------------------------------------------------------------------ */\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-primary);\n  color: var(--text-on-light);\n  background: var(--surface-inverse);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Links — mono, understated, high-contrast on both grounds. */\na {\n  color: inherit;\n  text-decoration: none;\n  transition: opacity var(--dur-fast) var(--ease-standard);\n}\na:hover { opacity: 0.6; }\n\n/* Selection uses the rare signal red — a single spark of colour. */\n::selection { background: var(--lx-signal); color: var(--lx-white); }\n\n<\u002Fstyle>\n<script src=\"f3b6a9a4-a284-4652-a2f5-f65b3d50d64c\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #383838; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display:flex; flex-direction:column; gap:28px; padding:28px; background:#383838; font-family:'Hanken Grotesk',Arial,sans-serif;\">\n\n  <!-- Title slide -->\n  <div style=\"width:1280px; height:720px; background:#000; color:#F7F7F7; position:relative; overflow:hidden; padding:44px 56px; box-sizing:border-box; display:flex; flex-direction:column;\">\n    <x-import component-from-global-scope=\"LoopXDesignSystem_d0e166.PageHeader\" tone=\"light\" left=\"LOOP X\" section=\"INVESTOR BRIEF\" index=\"01\" hint-size=\"100%,40px\"><\u002Fx-import>\n    <div style=\"flex:1; display:flex; align-items:center; justify-content:center;\">\n      <x-import component-from-global-scope=\"LoopXDesignSystem_d0e166.Logo\" height=\"{{ 150 }}\" tone=\"#F7F7F7\" hint-size=\"800px,150px\"><\u002Fx-import>\n    <\u002Fdiv>\n    <h1 style=\"margin:0; font-size:44px; line-height:0.9; text-transform:uppercase; letter-spacing:-0.01em; font-weight:400;\">Presentation<br>headline<\u002Fh1>\n  <\u002Fdiv>\n\n  <!-- Content slide -->\n  <div style=\"width:1280px; height:720px; background:#F7F7F7; color:#000; position:relative; overflow:hidden; padding:44px 56px; box-sizing:border-box; display:flex; flex-direction:column;\">\n    <x-import component-from-global-scope=\"LoopXDesignSystem_d0e166.PageHeader\" left=\"LOOP X\" section=\"PLATFORM\" index=\"02\" hint-size=\"100%,40px\"><\u002Fx-import>\n    <div style=\"flex:1; display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center; margin-top:24px;\">\n      <div>\n        <x-import component-from-global-scope=\"LoopXDesignSystem_d0e166.Eyebrow\" framed=\"{{ true }}\" hint-size=\"180px,28px\">Thermal perception<\u002Fx-import>\n        <h2 style=\"font-size:44px; margin:20px 0; line-height:0.9; text-transform:uppercase; font-weight:400;\">Autonomy is<br>won in the dark<\u002Fh2>\n        <p style=\"font-size:18px; line-height:1.5; max-width:440px; opacity:0.85; margin:0;\">We build perception where it is hardest — dust, glare and total dark — on the conviction that the most dangerous environments deserve the most intelligence.<\u002Fp>\n      <\u002Fdiv>\n      <img src=\"75dd6a7d-cae0-41d1-8e3f-183d5243c1d4\" alt=\"\" class=\"lx-chamfer\" style=\"--chamfer:16px; width:100%; height:460px; object-fit:cover; filter:grayscale(1) contrast(1.05);\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
