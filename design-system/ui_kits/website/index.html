<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Loop X — Website</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--lx-black); }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="screens.jsx" data-presets="react"></script>
<script type="text/babel" data-presets="react">
  const { Navbar } = window.LoopXDesignSystem_d0e166;
  const { Hero, Products, About } = window.LoopXSite;
  const NAV = ["HOME", "PLATFORM", "ABOUT", "SOLUTIONS"];

  function App() {
    const [page, setPage] = React.useState("HOME");
    const onDark = page !== "PLATFORM";
    const nav = <Navbar items={NAV} active={page} tone={onDark ? "light" : "dark"} onSelect={setPage} />;
    let screen;
    if (page === "PLATFORM" || page === "SOLUTIONS") screen = <Products nav={nav} />;
    else if (page === "ABOUT") screen = <About nav={nav} />;
    else screen = <Hero nav={nav} />;
    return screen;
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
