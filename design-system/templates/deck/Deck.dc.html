<x-dc>

<helmet>
<script src="./ds-base.js"></script>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap");
  body { margin: 0; background: #383838; }
</style>
</helmet>
<div style="display:flex; flex-direction:column; gap:28px; padding:28px; background:#383838; font-family:'Hanken Grotesk',Arial,sans-serif;">

  <!-- Title slide -->
  <div style="width:1280px; height:720px; background:#000; color:#F7F7F7; position:relative; overflow:hidden; padding:44px 56px; box-sizing:border-box; display:flex; flex-direction:column;">
    <x-import component-from-global-scope="LoopXDesignSystem_d0e166.PageHeader" tone="light" left="LOOP X" section="INVESTOR BRIEF" index="01" hint-size="100%,40px"></x-import>
    <div style="flex:1; display:flex; align-items:center; justify-content:center;">
      <x-import component-from-global-scope="LoopXDesignSystem_d0e166.Logo" height="{{ 150 }}" tone="#F7F7F7" hint-size="800px,150px"></x-import>
    </div>
    <h1 style="margin:0; font-size:44px; line-height:0.9; text-transform:uppercase; letter-spacing:-0.01em; font-weight:400;">Presentation<br/>headline</h1>
  </div>

  <!-- Content slide -->
  <div style="width:1280px; height:720px; background:#F7F7F7; color:#000; position:relative; overflow:hidden; padding:44px 56px; box-sizing:border-box; display:flex; flex-direction:column;">
    <x-import component-from-global-scope="LoopXDesignSystem_d0e166.PageHeader" left="LOOP X" section="PLATFORM" index="02" hint-size="100%,40px"></x-import>
    <div style="flex:1; display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center; margin-top:24px;">
      <div>
        <x-import component-from-global-scope="LoopXDesignSystem_d0e166.Eyebrow" framed="{{ true }}" hint-size="180px,28px">Thermal perception</x-import>
        <h2 style="font-size:44px; margin:20px 0; line-height:0.9; text-transform:uppercase; font-weight:400;">Autonomy is<br/>won in the dark</h2>
        <p style="font-size:18px; line-height:1.5; max-width:440px; opacity:0.85; margin:0;">We build perception where it is hardest — dust, glare and total dark — on the conviction that the most dangerous environments deserve the most intelligence.</p>
      </div>
      <img src="../../assets/img/cave-mud-pot.jpg" alt="" class="lx-chamfer" style="--chamfer:16px; width:100%; height:460px; object-fit:cover; filter:grayscale(1) contrast(1.05);" />
    </div>
  </div>

</div>
