<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--lx-black); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; height: 220px; }
  .cell { position: relative; overflow: hidden; background: #111; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) contrast(1.05); }
  .cap { position: absolute; left: 10px; bottom: 8px; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing:.04em; color: var(--lx-off-white); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><img src="../assets/img/thermal-vehicle.png" alt="terrain" /><span class="cap">Terrain</span></div>
    <div class="cell"><img src="../assets/img/thermal-terrain.png" alt="dust" /><span class="cap">Dust</span></div>
    <div class="cell"><img src="../assets/img/cave-mud-pot.jpg" alt="cave" /><span class="cap">Underground</span></div>
  </div>
</body>
</html>
