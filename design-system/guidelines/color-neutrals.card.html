<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Off-white, grey and deck backing for structure" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; height: 150px; }
  .sw { display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; color: var(--lx-black); }
  .name { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: .6; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--lx-off-white);box-shadow:inset 0 0 0 1px var(--hairline-light)">
      <span class="name">Off-white</span><span class="hex">#F7F7F7</span>
    </div>
    <div class="sw" style="background:var(--lx-grey)">
      <span class="name">Grey</span><span class="hex">#C4C4C4</span>
    </div>
    <div class="sw" style="background:var(--lx-grey-deck);color:var(--lx-off-white)">
      <span class="name">Deck grey</span><span class="hex">#383838</span>
    </div>
  </div>
</body>
</html>
