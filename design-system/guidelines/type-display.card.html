<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--lx-black); color: var(--lx-off-white); }
  .wrap { padding: 28px 36px; }
  .meta { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing:.04em; opacity:.55; margin-bottom: 14px; }
  h1 { margin: 0 0 6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="meta">Aeonik (Hanken Grotesk sub) · Regular · Uppercase · 90% leading</div>
    <h1 class="lx-display" style="font-size:64px">All condition</h1>
    <h1 class="lx-h1">Machine intelligence</h1>
  </div>
</body>
</html>
