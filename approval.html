<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Approval — Explore</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a; --panel: #111; --panel2: #161616;
      --border: #2a2a2a; --border2: #444;
      --fg: #f0f0f0; --mute: #777; --faint: #555; --dim: #333;
      --accent: #5b8def; --good: #4caf72; --warn: #d98b3a; --bad: #d9534f;
      --planner: #5b8def; --lens: #c77dff; --substrate: #d98b3a;
    }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100dvh; -webkit-tap-highlight-color: transparent;
      line-height: 1.5;
    }

    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 140px; }

    /* header / brief */
    .brand { font-size: 10px; font-weight: 500; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--faint); margin-bottom: 14px; }
    .brief { background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px 16px; margin-bottom: 8px; }
    .brief-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      margin-bottom: 8px; }
    .pill { font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 3px 8px; border-radius: 4px; background: var(--panel2);
      border: 1px solid var(--border); color: var(--mute); }
    .pill.type { color: var(--fg); border-color: var(--border2); }
    .brief-text { font-size: 14px; color: var(--fg); }
    .brief-text span { color: var(--faint); }
    .meta { font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--dim); margin-bottom: 20px; }

    .section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--faint); margin: 22px 2px 10px; }

    /* candidate cards */
    .cand { background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 14px; margin-bottom: 8px; transition: border-color .15s; }
    .cand.selected { border-color: var(--good); }
    .cand-top { display: flex; justify-content: space-between; align-items: center;
      gap: 8px; margin-bottom: 10px; }
    .cand-id { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mute); }
    .badges { display: flex; gap: 6px; align-items: center; }
    .score { font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--fg); background: var(--panel2); border: 1px solid var(--border);
      padding: 2px 7px; border-radius: 4px; }
    .control { font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--warn); border: 1px solid var(--warn); border-radius: 4px;
      padding: 2px 6px; opacity: .8; }

    .asset { font-size: 14px; color: var(--fg); margin-bottom: 10px;
      white-space: pre-wrap; }
    /* the editor — diff captured here automatically */
    .asset.editing { outline: none; border: 1px dashed var(--good);
      border-radius: 6px; padding: 10px; background: #0d0d0d; }
    .asset.editing:focus { border-style: solid; }
    .edit-hint { font-size: 10px; color: var(--good); margin-bottom: 10px; display: none; }
    .cand.selected .edit-hint { display: block; }

    .recipe { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }
    .recipe-lenses { display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
      margin-bottom: 6px; }
    .lens { font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 2px 7px; border-radius: 4px; background: rgba(199,125,255,.1);
      border: 1px solid rgba(199,125,255,.35); color: #c77dff; }
    .arrow { color: var(--dim); font-size: 11px; }
    .recipe-seq { font-size: 11px; color: var(--mute); font-style: italic; }

    .cand-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn { flex: 1; font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 9px; border-radius: 6px; cursor: pointer; border: 1px solid var(--border2);
      background: var(--panel2); color: var(--fg); transition: all .12s; }
    .btn:active { transform: scale(.98); }
    .btn.select { border-color: var(--good); color: var(--good); }
    .cand.selected .btn.select { background: var(--good); color: #06140b; }

    /* one-tap reject chips */
    .tags { margin-top: 10px; }
    .tags-label { font-size: 10px; color: var(--faint); margin-bottom: 6px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { font-family: 'JetBrains Mono', monospace; font-size: 10px;
      padding: 4px 8px; border-radius: 5px; cursor: pointer; user-select: none;
      border: 1px solid var(--border); background: var(--panel2); color: var(--mute);
      transition: all .12s; }
    .chip[data-layer="planner"] { --c: var(--planner); }
    .chip[data-layer="lens"] { --c: var(--lens); }
    .chip[data-layer="substrate"] { --c: var(--substrate); }
    .chip:active { transform: scale(.96); }
    .chip.on { background: var(--c); border-color: var(--c); color: #08080a; }
    .chip .layer { opacity: .6; }
    .chip.on .layer { opacity: .85; }

    /* commit bar */
    .bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0c0c0cee;
      backdrop-filter: blur(10px); border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      max-width: 480px; margin: 0 auto; }
    .bar-row { display: flex; gap: 8px; max-width: 480px; margin: 0 auto; }
    .commit { flex: 2; font-family: inherit; font-size: 14px; font-weight: 600;
      padding: 14px; border-radius: 8px; border: none; cursor: pointer;
      background: var(--good); color: #06140b; }
    .commit:active { transform: scale(.99); }
    .reject-all { flex: 1; font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 14px 8px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--bad); background: transparent; color: var(--bad); }

    /* one-tap delta_type picker */
    .delta-pick { display: none; }
    .delta-pick.show { display: block; }
    .delta-q { font-size: 12px; color: var(--mute); margin-bottom: 10px; }
    .delta-q span { color: var(--good); }
    .delta-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .delta-chip { flex: 1 1 auto; font-family: 'JetBrains Mono', monospace; font-size: 12px;
      padding: 12px 10px; border-radius: 8px; cursor: pointer; text-align: center;
      border: 1px solid var(--border2); background: var(--panel2); color: var(--fg);
      transition: all .12s; position: relative; }
    .delta-chip:active { transform: scale(.97); }
    .delta-chip.suggested { border-color: var(--good); color: var(--good); }
    .delta-chip.suggested::after { content: 'hint'; position: absolute; top: -7px; right: 6px;
      font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--good);
      background: var(--bg); padding: 0 4px; }
    .delta-cancel { font-family: inherit; font-size: 11px; color: var(--faint);
      background: none; border: none; cursor: pointer; padding: 4px; }

    /* payload = the contract, made visible */
    .payload { margin-top: 30px; }
    .payload-head { display: flex; justify-content: space-between; align-items: center;
      margin: 0 2px 8px; }
    .payload-title { font-size: 10px; font-weight: 600; letter-spacing: .16em;
      text-transform: uppercase; color: var(--faint); }
    .timer { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--dim); }
    pre { font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.55;
      background: #0d0d0d; border: 1px solid var(--border); border-radius: 8px;
      padding: 14px; overflow-x: auto; color: #cfd3da; }
    .k { color: #7aa2f7; } .s { color: #9ece6a; } .n { color: #e0af68; }
    .b { color: #bb9af7; } .nul { color: var(--dim); }

    .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
      background: var(--good); color: #06140b; font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: 8px; opacity: 0; pointer-events: none;
      transition: all .25s; z-index: 10; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Homesick — Approval</div>

    <div class="brief">
      <div class="brief-row">
        <span class="pill type" id="briefType">product_drop</span>
        <span class="pill" id="loopId">loop_homesick</span>
        <span class="pill" id="subVer">sub_v3.2</span>
      </div>
      <div class="brief-text" id="briefText"></div>
    </div>
    <div class="meta" id="ciId"></div>

    <div class="section-label">Candidates · tap to select, edit inline, tag the misses</div>
    <div id="cands"></div>

    <div class="payload">
      <div class="payload-head">
        <span class="payload-title">Write payload (live)</span>
        <span class="timer" id="timer">time_to_decide: 0s</span>
      </div>
      <pre id="payload"></pre>
    </div>
  </div>

  <div class="bar">
    <div class="bar-row" id="commitRow">
      <button class="commit" id="commit">Approve &amp; ship</button>
      <button class="reject-all" id="rejectAll">Reject all</button>
    </div>
    <!-- one-tap delta_type picker — appears only when the candidate was edited -->
    <div class="delta-pick" id="deltaPick">
      <div class="delta-q">You edited it — what kind of change? <span>(1 tap → ships)</span></div>
      <div class="delta-chips" id="deltaChips"></div>
      <button class="delta-cancel" id="deltaCancel">cancel</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  // ─── INPUT CONTRACT: the content_item handed to the view at `approval` stage ───
  const ITEM = {
    loop_id: "loop_homesick",
    content_item_id: "ci_2026_0620_017",
    substrate_version: "sub_v3.2",
    brief: {
      brief_type: "product_drop",
      brief_text: "Tease the linen pillow restock — warm, not salesy."
    },
    candidates: [
      {
        candidate_id: "cand_a",
        asset: { kind: "text", body: "The linen pillows are back. You know the ones — the kind that make a made bed look like an unmade promise. Tomorrow, 9am." },
        internal_score: 0.81, is_control: false,
        gen_methods: ["Alexander", "Alien"],
        making_plan: {
          lenses: ["Alexander", "Alien"],
          sequence: "Alexander frames the object → Alien twists the close",
          hand_offs: ["Alexander→Alien: keep the object, break the expectation"]
        }
      },
      {
        candidate_id: "cand_b",
        asset: { kind: "text", body: "Our best-selling linen pillows are restocking tomorrow at 9am. Don't miss out — they sell fast! Set your alarm." },
        internal_score: 0.74, is_control: false,
        gen_methods: ["Alexander"],
        making_plan: {
          lenses: ["Alexander"],
          sequence: "Alexander only — straight product frame",
          hand_offs: []
        }
      },
      {
        candidate_id: "cand_c",
        asset: { kind: "text", body: "Restock incoming. Linen. 9am. Be early or be sad about it." },
        internal_score: 0.69, is_control: true,
        gen_methods: ["Alien", "Brevity"],
        making_plan: {
          lenses: ["Alien", "Brevity"],
          sequence: "Alien reframes → Brevity strips to the bone",
          hand_offs: ["Alien→Brevity: hold the twist, cut everything else"]
        }
      }
    ]
  };

  // reject-tag taxonomy — each tag carries the LAYER it routes to
  const TAGS = [
    { tag: "too_literal",      layer: "planner"   },
    { tag: "too_safe",         layer: "planner"   },
    { tag: "wrong_format",     layer: "planner"   },
    { tag: "off_brand_visual", layer: "lens"      },
    { tag: "off_voice",        layer: "lens"      },
    { tag: "weak_hook",        layer: "lens"      },
    { tag: "factual_error",    layer: "substrate" },
    { tag: "stale_reference",  layer: "substrate" },
    { tag: "derivative",       layer: "substrate" }
  ];

  // ─── view state ───
  const state = {
    selectedId: ITEM.candidates[0].candidate_id,
    edits: {},                 // candidate_id -> current editor text (after)
    rejectTags: [],            // { tag, layer, target_ref, note }
    openedAt: Date.now(),
    committed: false
  };
  // seed editor "after" with the original "before" for every candidate
  ITEM.candidates.forEach(c => state.edits[c.candidate_id] = c.asset.body);

  const $ = (id) => document.getElementById(id);

  // ── render header ──
  $('briefType').textContent = ITEM.brief.brief_type;
  $('loopId').textContent = ITEM.loop_id;
  $('subVer').textContent = ITEM.substrate_version;
  $('briefText').textContent = ITEM.brief.brief_text;
  $('ciId').textContent = ITEM.content_item_id;

  // ── render candidates ──
  function renderCands() {
    const root = $('cands'); root.innerHTML = '';
    ITEM.candidates.forEach(c => {
      const sel = c.candidate_id === state.selectedId;
      const el = document.createElement('div');
      el.className = 'cand' + (sel ? ' selected' : '');

      const lenses = c.making_plan.lenses
        .map(l => `<span class="lens">${l}</span>`).join('<span class="arrow">→</span>');

      const chips = TAGS.map(t => {
        const on = state.rejectTags.some(r => r.tag === t.tag && r.target_ref === c.candidate_id);
        return `<span class="chip${on?' on':''}" data-layer="${t.layer}"
                  data-tag="${t.tag}" data-cand="${c.candidate_id}">
                  ${t.tag} <span class="layer">·${t.layer}</span></span>`;
      }).join('');

      el.innerHTML = `
        <div class="cand-top">
          <span class="cand-id">${c.candidate_id}</span>
          <div class="badges">
            ${c.is_control ? '<span class="control">control</span>' : ''}
            <span class="score">${c.internal_score.toFixed(2)}</span>
          </div>
        </div>
        <div class="edit-hint">▸ editing — before = what the AI made · after = what ships</div>
        <div class="asset${sel?' editing':''}" ${sel?'contenteditable="true"':''}
             data-cand="${c.candidate_id}">${state.edits[c.candidate_id]}</div>
        <div class="recipe">
          <div class="recipe-lenses">${lenses}</div>
          <div class="recipe-seq">${c.making_plan.sequence}</div>
        </div>
        <div class="cand-actions">
          <button class="btn select" data-select="${c.candidate_id}">
            ${sel ? '✓ Selected — ships' : 'Select this'}</button>
        </div>
        <div class="tags">
          <div class="tags-label">tag the miss (1 tap → routes to layer):</div>
          <div class="chips">${chips}</div>
        </div>`;
      root.appendChild(el);
    });
    bind();
    renderPayload();
  }

  function bind() {
    document.querySelectorAll('[data-select]').forEach(b =>
      b.onclick = () => { state.selectedId = b.dataset.select; renderCands(); });

    document.querySelectorAll('.chip').forEach(ch =>
      ch.onclick = () => {
        const { tag, cand, layer } = ch.dataset;
        const i = state.rejectTags.findIndex(r => r.tag === tag && r.target_ref === cand);
        if (i >= 0) state.rejectTags.splice(i, 1);
        else state.rejectTags.push({ tag, layer, target_ref: cand, note: null });
        renderCands();
      });

    // edit-diff captured at the editor level — no "save" step
    document.querySelectorAll('.asset[contenteditable]').forEach(ed =>
      ed.oninput = () => { state.edits[ed.dataset.cand] = ed.innerText; renderPayload(); });
  }

  // the delta_type vocabulary — human picks one at commit (truth)
  const DELTAS = ["tightened", "rewrote", "reordered", "tone", "factual"];

  // heuristic is a HINT ONLY — it pre-highlights a guess, never writes the label
  function deltaHint(before, after) {
    if (before === after) return "none";
    const ratio = after.length / before.length;
    if (after.length < before.length && before.includes(after.slice(0, 12))) return "tightened";
    if (ratio < 0.55 || ratio > 1.8) return "rewrote";
    return "tightened";
  }

  // ── OUTPUT CONTRACT: the append-only approval record ──
  // delta is null on the live panel until the human taps it at commit
  function buildPayload(action, delta) {
    const sel = ITEM.candidates.find(c => c.candidate_id === state.selectedId);
    const before = sel ? sel.asset.body : null;
    const after = sel ? state.edits[sel.candidate_id] : null;
    const isReject = action === "reject_all";
    const edited = !isReject && before !== after;
    return {
      content_item_id: ITEM.content_item_id,
      loop_id: ITEM.loop_id,
      substrate_version: ITEM.substrate_version,
      stage: "approval",
      approval_action: isReject ? "reject_all" : (edited ? "approve_with_edits" : "approve"),
      selected_candidate_id: isReject ? null : state.selectedId,
      edit_diff: isReject ? null : {
        before, after,
        delta_type: edited ? (delta || null) : "none",   // human-tapped truth
        delta_hint: edited ? deltaHint(before, after) : "none"  // heuristic, for reference only
      },
      reject_tags: state.rejectTags,
      time_to_decide_sec: Math.round((Date.now() - state.openedAt) / 1000),
      decided_at: new Date().toISOString(),
      decided_by: "mark@deckdoctors.xyz"
    };
  }

  // ── syntax-lit JSON for the live panel ──
  function hl(obj) {
    let j = JSON.stringify(obj, null, 2);
    j = j.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return j
      .replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:')
      .replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>')
      .replace(/: (-?\d+\.?\d*)/g, ': <span class="n">$1</span>')
      .replace(/: (true|false)/g, ': <span class="b">$1</span>')
      .replace(/: null/g, ': <span class="nul">null</span>');
  }
  function renderPayload() {
    $('payload').innerHTML = hl(buildPayload(
      state.selectedId ? "approve" : "reject_all"));
  }

  // ── commit ──
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
  function write(action, delta) {
    if (state.committed) return;
    state.committed = true;
    const payload = buildPayload(action, delta);
    // v1: this is where we'd POST to Supabase (append-only insert).
    console.log("APPROVAL WRITE →", payload);
    $('payload').innerHTML = hl(payload);
    hideDeltaPick();
    toast(action === "reject_all" ? "Rejected — tags routed" : "Shipped — edit_diff banked");
    setTimeout(() => { state.committed = false; }, 2500); // demo only
  }

  // delta picker: one tap = pick the label AND ship
  function showDeltaPick() {
    const sel = ITEM.candidates.find(c => c.candidate_id === state.selectedId);
    const hint = deltaHint(sel.asset.body, state.edits[sel.candidate_id]);
    $('deltaChips').innerHTML = DELTAS.map(d =>
      `<button class="delta-chip${d === hint ? ' suggested' : ''}" data-delta="${d}">${d}</button>`
    ).join('');
    document.querySelectorAll('.delta-chip').forEach(c =>
      c.onclick = () => write("approve", c.dataset.delta));
    $('commitRow').style.display = 'none';
    $('deltaPick').classList.add('show');
  }
  function hideDeltaPick() {
    $('deltaPick').classList.remove('show');
    $('commitRow').style.display = 'flex';
  }
  $('deltaCancel').onclick = hideDeltaPick;

  $('commit').onclick = () => {
    const sel = ITEM.candidates.find(c => c.candidate_id === state.selectedId);
    const edited = sel && sel.asset.body !== state.edits[sel.candidate_id];
    if (edited) showDeltaPick();          // edited → one tap to label, then ships
    else write("approve", "none");        // untouched → ship straight, delta_type none
  };
  $('rejectAll').onclick = () => { state.selectedId = null; write("reject_all"); };

  // ── silent friction timer ──
  setInterval(() => {
    if (state.committed) return;
    const s = Math.round((Date.now() - state.openedAt) / 1000);
    $('timer').textContent = `time_to_decide: ${s}s`;
    // payload time updates only on interaction to avoid churn; refresh number here:
    renderPayload();
  }, 1000);

  renderCands();
  </script>
</body>
</html>
