  .logo i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--amber)}
  .nav-cta{border:1px solid var(--line);background:#141a1d;color:#e9eef0;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600}

  .dotp{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(255,138,61,.6);animation:pl 1.8s infinite}
  @keyframes pl{70%{box-shadow:0 0 0 7px rgba(255,138,61,0)}}
  h1{font-size:clamp(34px,5vw,54px);line-height:1.05;letter-spacing:-.03em;font-weight:800}

  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .micro{margin-top:14px;font-size:12.5px;color:#606d72}
  /* scope, amber */
  .scope{position:relative;aspect-ratio:1;width:100%;max-width:372px;margin-left:auto;margin-right:12px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,138,61,.16) 0%,#171e14 44%,#0d120e 100%);border:1.5px solid rgba(255,140,70,.45);
    box-shadow:inset 0 0 70px rgba(255,138,61,.2),0 24px 80px -22px rgba(255,138,61,.55)}
  .scope::after{content:"";position:absolute;top:50%;left:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--amber);box-shadow:0 0 20px 4px var(--amber)}
  .ring{position:absolute;border:1.5px solid rgba(255,170,100,.45);border-radius:50%}.r1{inset:10%}.r2{inset:28%}.r3{inset:46%}
  .cx{position:absolute;inset:0 50% 0 50%;width:1.5px;background:rgba(255,170,100,.32)}.cy{position:absolute;inset:50% 0 50% 0;height:1.5px;background:rgba(255,170,100,.32)}
  .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,138,61,.72),rgba(255,138,61,.14) 46deg,rgba(255,138,61,0) 92deg);animation:spin 3.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blip{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--amber);box-shadow:0 0 14px 2px var(--amber);animation:bl 3.8s infinite}
  .blip b{position:absolute;right:16px;top:-4px;white-space:nowrap;font-size:10px;font-weight:600;color:var(--amber2);background:#0c0f0cdd;padding:2px 6px;border-radius:5px;border:1px solid #3a2c1e;text-align:right}
  @keyframes bl{0%,50%{opacity:.4}62%{opacity:1}100%{opacity:.5}}
  .b1{top:26%;left:58%;animation-delay:.6s}.b2{top:64%;left:36%;animation-delay:1.9s}.b3{top:44%;left:66%;animation-delay:2.8s}
  .ticker{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#0e1214;padding:11px 0;margin-top:6px}
  .track{display:flex;gap:44px;white-space:nowrap;animation:scroll 28s linear infinite;font-size:12.5px;color:#9aa7ac}
  .track b{color:var(--amber2)}
  @keyframes scroll{to{transform:translateX(-50%)}}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:40px 0}
  .m{border:1px solid var(--line);border-radius:13px;padding:18px;background:var(--panel)}
  .m b{font-size:27px;font-weight:800;letter-spacing:-.02em}.m .mono{color:var(--steel);font-size:12px}.m span{color:var(--mut);font-size:13px;display:block;margin-top:2px}
  /* product feed */
  .feed-sec{padding:20px 0 10px}
  .h2{font-size:clamp(24px,3.2vw,32px);letter-spacing:-.02em;font-weight:800;margin-bottom:6px}
  .lead{color:var(--mut);max-width:56ch;margin-bottom:22px}
  .feed{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#12181b,#0e1315);overflow:hidden}
  .fbar{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
  .fbar .d{width:9px;height:9px;border-radius:50%}.da{background:#ff6a5f}.db{background:#f5b23e}.dc{background:#39c26a}
  .fbar b{margin-left:6px;color:#c8d1d4}
  .row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid #171e21}
  .row:last-child{border:0}
  .sc{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#1a0f06}
  .hot{background:linear-gradient(135deg,#ffb27a,#ff6a2b)}.warm{background:linear-gradient(135deg,#8fd0e2,#4f9fb4);color:#06171d}
  .row h4{font-size:15px}.row .rm{color:var(--mut);font-size:12.5px}
  .chips{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
  .chip{font-size:10.5px;color:var(--amber2);border:1px solid #33251a;border-radius:100px;padding:2px 8px}
  .draft{font-size:12.5px;font-weight:700;color:#1a0f06;background:var(--amber);padding:8px 12px;border-radius:8px}
  /* comparison (LOWER) */
  .vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:50px 0}
  .vc{border-radius:14px;padding:22px;border:1px solid var(--line)}
  .vc h3{font-size:16px;margin-bottom:14px;font-weight:800}
  .vc ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .vc li{display:flex;gap:9px;font-size:14px}
  .old{background:#0f1315}.old li{color:#7c878c}.old .i{color:#c0554e;font-weight:800}
  .new{background:#14100b;border-color:#33251a}.new .i{color:var(--amber);font-weight:800}
  .foot{text-align:center;padding:56px 0;border-top:1px solid var(--line)}
  .foot h2{font-size:clamp(26px,3.4vw,38px);letter-spacing:-.02em;margin-bottom:10px}
  .foot p{color:var(--mut);margin-bottom:22px}
  @media(max-width:860px){.hero{grid-template-columns:1fr}.scope{margin:0 auto}.metrics{grid-template-columns:1fr 1fr}.vs{grid-template-columns:1fr}}
</style>
