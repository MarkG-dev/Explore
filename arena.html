<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Arena — Explore</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }

    #game {
      display: block;
      width: 100vw;
      height: 100dvh;
      background: #0d0f14;
      cursor: crosshair;
    }

    /* HUD */
    .hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .hud-left { display: flex; flex-direction: column; gap: 8px; }

    .brand {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
    }

    .stat-row { display: flex; gap: 14px; align-items: center; }

    .stat {
      font-size: 12px;
      font-weight: 600;
      color: #cfcfcf;
      letter-spacing: 0.04em;
    }
    .stat b { color: #fff; font-weight: 700; }
    .stat.wave b { color: #ffd24a; }
    .stat.score b { color: #4ad6ff; }

    .health-bar {
      width: 160px;
      height: 10px;
      border-radius: 6px;
      background: #1a1d24;
      border: 1px solid #2a2e38;
      overflow: hidden;
      margin-top: 2px;
    }
    .health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff4d6d, #ff8a5c);
      transition: width 0.12s ease-out;
    }

    .hud-right {
      text-align: right;
      font-size: 10px;
      color: #444;
      letter-spacing: 0.08em;
      line-height: 1.6;
    }

    /* Joysticks */
    .stick {
      position: fixed;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      bottom: 28px;
      z-index: 8;
      display: none;
      touch-action: none;
    }
    .stick.left { left: 28px; }
    .stick.right { right: 28px; }
    .stick .nub {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      left: 37px; top: 37px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      transition: transform 0.02s linear;
    }
    .stick.right .nub { background: rgba(74,214,255,0.18); border-color: rgba(74,214,255,0.3); }

    body.touch .stick { display: block; }

    /* Overlay (start / game over) */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(8,9,12,0.86);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }

    .panel { max-width: 360px; width: 100%; }
    .panel .brand { margin-bottom: 18px; }
    .panel h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .panel h1 span { color: #4ad6ff; }
    .panel p {
      font-size: 13px;
      color: #888;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .panel .big-score {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 28px;
    }
    .panel .big-score b { color: #fff; font-size: 17px; }

    .btn {
      display: inline-block;
      padding: 15px 40px;
      background: #4ad6ff;
      color: #07121a;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, filter 0.1s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.97); }

    .controls-hint {
      margin-top: 26px;
      font-size: 11px;
      color: #555;
      line-height: 1.8;
    }
    .controls-hint kbd {
      background: #1a1d24;
      border: 1px solid #2a2e38;
      border-radius: 4px;
      padding: 2px 7px;
      font-family: inherit;
      font-size: 10px;
      color: #bbb;
    }

    .back {
      position: fixed;
      bottom: 14px; left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #333;
      text-decoration: none;
      z-index: 9;
      pointer-events: auto;
    }
    .back:hover { color: #666; }
    body.touch .back { display: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="hud-left">
      <div class="brand">Arena</div>
      <div class="stat-row">
        <div class="stat wave">WAVE <b id="wave">1</b></div>
        <div class="stat score">SCORE <b id="score">0</b></div>
      </div>
      <div class="health-bar"><div class="health-fill" id="healthFill"></div></div>
    </div>
    <div class="hud-right" id="hudRight"></div>
  </div>

  <div class="stick left" id="stickLeft"><div class="nub" id="nubLeft"></div></div>
  <div class="stick right" id="stickRight"><div class="nub" id="nubRight"></div></div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="brand">Homesick · Explore</div>
      <h1 id="title">Twin-Stick <span>Arena</span></h1>
      <p id="subtitle">Survive the waves. Move with the left stick, aim and fire with the right.</p>
      <div class="big-score hidden" id="finalScore"></div>
      <button class="btn" id="startBtn">Enter Arena</button>
      <div class="controls-hint" id="hint">
        <kbd>WASD</kbd> move &nbsp;·&nbsp; <kbd>Mouse</kbd> aim &nbsp;·&nbsp; <kbd>Click</kbd> / hold to fire
      </div>
    </div>
  </div>

  <a class="back" href="/">&larr; back to Explore</a>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Arena — a single-file twin-stick top-down action prototype.
  //
  // Architecture is split into an authoritative-style world `step(dt, input)`
  // and a separate `render()`, with all gameplay driven by a normalized
  // `input` snapshot (move vector + aim vector + fire flag). That boundary is
  // deliberate: it's the seam where a network transport would slot in —
  // collect input on the client, send to a server that runs `step`, and
  // broadcast world state back. For now the world runs locally with bot
  // enemies, but the shape is ready for a client-predictive / server-
  // authoritative model.
  // ---------------------------------------------------------------------------

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const ui = {
    wave: document.getElementById('wave'),
    score: document.getElementById('score'),
    healthFill: document.getElementById('healthFill'),
    hudRight: document.getElementById('hudRight'),
    overlay: document.getElementById('overlay'),
    title: document.getElementById('title'),
    subtitle: document.getElementById('subtitle'),
    finalScore: document.getElementById('finalScore'),
    startBtn: document.getElementById('startBtn'),
    hint: document.getElementById('hint'),
  };

  // --- World constants --------------------------------------------------------
  const ARENA = { w: 1600, h: 1600 };
  const PLAYER = { radius: 16, speed: 260, maxHp: 100, fireRate: 0.16, bulletSpeed: 620, bulletDmg: 24 };
  const ENEMY = { radius: 15, baseSpeed: 70, baseHp: 40, touchDmg: 12, touchCooldown: 0.6 };

  // --- Device detection -------------------------------------------------------
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) document.body.classList.add('touch');

  // --- Display / DPI handling -------------------------------------------------
  let view = { w: 0, h: 0, dpr: 1 };
  function resize() {
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    view.w = window.innerWidth;
    view.h = window.innerHeight;
    canvas.width = Math.floor(view.w * view.dpr);
    canvas.height = Math.floor(view.h * view.dpr);
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Math helpers -----------------------------------------------------------
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const len = (x, y) => Math.hypot(x, y);
  function norm(x, y) { const l = len(x, y) || 1; return [x / l, y / l]; }

  // --- Game state -------------------------------------------------------------
  let state = 'menu'; // 'menu' | 'playing' | 'dead'
  let world = null;

  function newWorld() {
    return {
      player: {
        x: ARENA.w / 2, y: ARENA.h / 2,
        hp: PLAYER.maxHp, aim: [1, 0],
        fireCooldown: 0, hitFlash: 0,
      },
      bullets: [],
      enemies: [],
      particles: [],
      pickups: [],
      wave: 0,
      score: 0,
      betweenWaves: 1.2,   // countdown to first wave
      spawnQueue: 0,
      spawnTimer: 0,
      shake: 0,
      time: 0,
    };
  }

  // --- Input ------------------------------------------------------------------
  const keys = {};
  const mouse = { x: 0, y: 0, down: false };

  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });

  canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  canvas.addEventListener('mousedown', e => { if (e.button === 0) mouse.down = true; });
  window.addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });

  // Virtual joysticks (touch)
  const stickState = {
    left:  { el: document.getElementById('stickLeft'),  nub: document.getElementById('nubLeft'),  id: null, dx: 0, dy: 0 },
    right: { el: document.getElementById('stickRight'), nub: document.getElementById('nubRight'), id: null, dx: 0, dy: 0 },
  };
  const STICK_MAX = 48;

  function bindStick(s) {
    const start = (e) => {
      for (const t of e.changedTouches) {
        if (s.id === null) {
          s.id = t.identifier;
          updateStick(s, t);
        }
      }
      e.preventDefault();
    };
    const move = (e) => {
      for (const t of e.changedTouches) if (t.identifier === s.id) updateStick(s, t);
      e.preventDefault();
    };
    const end = (e) => {
      for (const t of e.changedTouches) if (t.identifier === s.id) resetStick(s);
      e.preventDefault();
    };
    s.el.addEventListener('touchstart', start, { passive: false });
    s.el.addEventListener('touchmove', move, { passive: false });
    s.el.addEventListener('touchend', end, { passive: false });
    s.el.addEventListener('touchcancel', end, { passive: false });
  }
  function updateStick(s, t) {
    const r = s.el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = t.clientX - cx, dy = t.clientY - cy;
    const d = len(dx, dy);
    if (d > STICK_MAX) { dx = dx / d * STICK_MAX; dy = dy / d * STICK_MAX; }
    s.nub.style.transform = `translate(${dx}px, ${dy}px)`;
    s.dx = dx / STICK_MAX; s.dy = dy / STICK_MAX;
  }
  function resetStick(s) {
    s.id = null; s.dx = 0; s.dy = 0;
    s.nub.style.transform = 'translate(0,0)';
  }
  if (isTouch) { bindStick(stickState.left); bindStick(stickState.right); }

  // Build a normalized input snapshot for this frame.
  function sampleInput() {
    let mx = 0, my = 0;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;

    let aim = null, fire = false;

    if (isTouch) {
      mx = stickState.left.dx; my = stickState.left.dy;
      const r = stickState.right;
      if (len(r.dx, r.dy) > 0.25) { aim = norm(r.dx, r.dy); fire = true; }
    } else {
      if (len(mx, my) > 1) [mx, my] = norm(mx, my);
      // aim from player toward mouse (screen → world via camera offset at render time)
      aim = 'mouse';
      fire = mouse.down || keys[' '];
    }

    // clamp analog move magnitude
    const m = len(mx, my);
    if (m > 1) { mx /= m; my /= m; }

    return { mx, my, aim, fire };
  }

  // --- Camera -----------------------------------------------------------------
  const cam = { x: 0, y: 0 };
  function updateCamera() {
    const p = world.player;
    cam.x = clamp(p.x - view.w / 2, 0, ARENA.w - view.w);
    cam.y = clamp(p.y - view.h / 2, 0, ARENA.h - view.h);
    if (ARENA.w < view.w) cam.x = (ARENA.w - view.w) / 2;
    if (ARENA.h < view.h) cam.y = (ARENA.h - view.h) / 2;
  }

  // --- Spawning ---------------------------------------------------------------
  function startWave(n) {
    world.wave = n;
    world.spawnQueue = 3 + Math.floor(n * 1.8);
    world.spawnTimer = 0;
    ui.wave.textContent = n;
  }

  function spawnEnemy() {
    // spawn at arena edge, away from player
    const edge = Math.floor(Math.random() * 4);
    let x, y;
    if (edge === 0) { x = Math.random() * ARENA.w; y = -20; }
    else if (edge === 1) { x = ARENA.w + 20; y = Math.random() * ARENA.h; }
    else if (edge === 2) { x = Math.random() * ARENA.w; y = ARENA.h + 20; }
    else { x = -20; y = Math.random() * ARENA.h; }

    const tier = Math.random();
    const isBrute = tier > 0.82 && world.wave >= 3;
    const hpScale = 1 + (world.wave - 1) * 0.18;

    world.enemies.push({
      x, y,
      radius: isBrute ? ENEMY.radius * 1.6 : ENEMY.radius,
      hp: (isBrute ? ENEMY.baseHp * 2.6 : ENEMY.baseHp) * hpScale,
      maxHp: (isBrute ? ENEMY.baseHp * 2.6 : ENEMY.baseHp) * hpScale,
      speed: (isBrute ? ENEMY.baseSpeed * 0.7 : ENEMY.baseSpeed) + world.wave * 4,
      touchTimer: 0,
      brute: isBrute,
      hitFlash: 0,
      wobble: Math.random() * Math.PI * 2,
    });
  }

  // --- Particles --------------------------------------------------------------
  function burst(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.3 + Math.random() * 0.7);
      world.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.4 + Math.random() * 0.3, maxLife: 0.7,
        color, size: 1.5 + Math.random() * 2.5,
      });
    }
  }

  // --- Simulation step (the "authoritative" tick) -----------------------------
  function step(dt, input) {
    const p = world.player;
    world.time += dt;

    // resolve aim direction in world space
    let aimVec;
    if (input.aim === 'mouse') {
      aimVec = norm(mouse.x + cam.x - p.x, mouse.y + cam.y - p.y);
    } else if (input.aim) {
      aimVec = input.aim;
    } else {
      aimVec = p.aim;
    }
    p.aim = aimVec;

    // movement
    p.x = clamp(p.x + input.mx * PLAYER.speed * dt, p.radius, ARENA.w - p.radius);
    p.y = clamp(p.y + input.my * PLAYER.speed * dt, p.radius, ARENA.h - p.radius);

    // firing
    p.fireCooldown -= dt;
    if (input.fire && p.fireCooldown <= 0) {
      p.fireCooldown = PLAYER.fireRate;
      const spread = (Math.random() - 0.5) * 0.05;
      const ca = Math.cos(spread), sa = Math.sin(spread);
      const ax = aimVec[0] * ca - aimVec[1] * sa;
      const ay = aimVec[0] * sa + aimVec[1] * ca;
      world.bullets.push({
        x: p.x + ax * p.radius, y: p.y + ay * p.radius,
        vx: ax * PLAYER.bulletSpeed, vy: ay * PLAYER.bulletSpeed,
        life: 1.1,
      });
      burst(p.x + ax * p.radius, p.y + ay * p.radius, '#ffd24a', 3, 80);
      world.shake = Math.min(world.shake + 1.4, 8);
    }

    if (p.hitFlash > 0) p.hitFlash -= dt;

    // bullets
    for (let i = world.bullets.length - 1; i >= 0; i--) {
      const b = world.bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0 || b.x < 0 || b.y < 0 || b.x > ARENA.w || b.y > ARENA.h) {
        world.bullets.splice(i, 1);
      }
    }

    // wave management
    if (world.spawnQueue <= 0 && world.enemies.length === 0) {
      world.betweenWaves -= dt;
      if (world.betweenWaves <= 0) {
        world.betweenWaves = 2.5;
        startWave(world.wave + 1);
      }
    }
    if (world.spawnQueue > 0) {
      world.spawnTimer -= dt;
      if (world.spawnTimer <= 0) {
        world.spawnTimer = clamp(0.7 - world.wave * 0.03, 0.18, 0.7);
        spawnEnemy();
        world.spawnQueue--;
      }
    }

    // enemies: simple "navmesh-free" steering straight toward the player,
    // with a wobble so packs don't perfectly overlap. This is the local-bot
    // stand-in for what would be server-driven AI in a networked build.
    for (let i = world.enemies.length - 1; i >= 0; i--) {
      const e = world.enemies[i];
      e.wobble += dt * 2;
      let [dx, dy] = norm(p.x - e.x, p.y - e.y);
      const perpX = -dy, perpY = dx;
      const w = Math.sin(e.wobble) * 0.35;
      dx += perpX * w; dy += perpY * w;
      [dx, dy] = norm(dx, dy);
      e.x += dx * e.speed * dt;
      e.y += dy * e.speed * dt;
      if (e.hitFlash > 0) e.hitFlash -= dt;
      if (e.touchTimer > 0) e.touchTimer -= dt;

      // separation from other enemies (cheap soft collision)
      for (let j = i - 1; j >= 0; j--) {
        const o = world.enemies[j];
        const ddx = e.x - o.x, ddy = e.y - o.y;
        const d = len(ddx, ddy);
        const min = e.radius + o.radius;
        if (d > 0 && d < min) {
          const push = (min - d) / 2;
          const nx = ddx / d, ny = ddy / d;
          e.x += nx * push; e.y += ny * push;
          o.x -= nx * push; o.y -= ny * push;
        }
      }

      // touch damage to player
      const pd = len(e.x - p.x, e.y - p.y);
      if (pd < e.radius + p.radius && e.touchTimer <= 0) {
        e.touchTimer = ENEMY.touchCooldown;
        const dmg = e.brute ? ENEMY.touchDmg * 1.8 : ENEMY.touchDmg;
        p.hp -= dmg;
        p.hitFlash = 0.25;
        world.shake = Math.min(world.shake + 6, 16);
        burst(p.x, p.y, '#ff4d6d', 6, 140);
        if (p.hp <= 0) { p.hp = 0; gameOver(); return; }
      }
    }

    // bullet ↔ enemy collisions
    for (let i = world.bullets.length - 1; i >= 0; i--) {
      const b = world.bullets[i];
      for (let j = world.enemies.length - 1; j >= 0; j--) {
        const e = world.enemies[j];
        if (len(b.x - e.x, b.y - e.y) < e.radius + 3) {
          e.hp -= PLAYER.bulletDmg;
          e.hitFlash = 0.12;
          burst(b.x, b.y, '#4ad6ff', 4, 120);
          world.bullets.splice(i, 1);
          if (e.hp <= 0) {
            burst(e.x, e.y, e.brute ? '#ff8a5c' : '#7affb0', e.brute ? 22 : 12, 200);
            world.enemies.splice(j, 1);
            world.score += e.brute ? 50 : 10;
            world.shake = Math.min(world.shake + 3, 14);
            if (Math.random() < 0.16) {
              world.pickups.push({ x: e.x, y: e.y, type: 'hp', life: 12, bob: 0 });
            }
          }
          break;
        }
      }
    }

    // pickups
    for (let i = world.pickups.length - 1; i >= 0; i--) {
      const pk = world.pickups[i];
      pk.life -= dt; pk.bob += dt * 4;
      if (pk.life <= 0) { world.pickups.splice(i, 1); continue; }
      if (len(pk.x - p.x, pk.y - p.y) < p.radius + 16) {
        if (pk.type === 'hp') { p.hp = clamp(p.hp + 25, 0, PLAYER.maxHp); burst(p.x, p.y, '#7affb0', 10, 120); }
        world.pickups.splice(i, 1);
      }
    }

    // particles
    for (let i = world.particles.length - 1; i >= 0; i--) {
      const pt = world.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.92; pt.vy *= 0.92;
      pt.life -= dt;
      if (pt.life <= 0) world.particles.splice(i, 1);
    }

    if (world.shake > 0) world.shake = Math.max(0, world.shake - dt * 30);

    // sync HUD
    ui.score.textContent = world.score;
    ui.healthFill.style.width = (p.hp / PLAYER.maxHp * 100) + '%';
  }

  // --- Rendering --------------------------------------------------------------
  function render() {
    ctx.clearRect(0, 0, view.w, view.h);

    let sx = 0, sy = 0;
    if (world.shake > 0.1) {
      sx = (Math.random() - 0.5) * world.shake;
      sy = (Math.random() - 0.5) * world.shake;
    }
    ctx.save();
    ctx.translate(-cam.x + sx, -cam.y + sy);

    drawArena();

    // pickups
    for (const pk of world.pickups) {
      const yo = Math.sin(pk.bob) * 3;
      const a = pk.life < 2 ? (Math.sin(pk.life * 12) * 0.4 + 0.6) : 1;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#7affb0';
      ctx.beginPath(); ctx.arc(pk.x, pk.y + yo, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#07121a';
      ctx.fillRect(pk.x - 5, pk.y + yo - 1.5, 10, 3);
      ctx.fillRect(pk.x - 1.5, pk.y + yo - 5, 3, 10);
      ctx.globalAlpha = 1;
    }

    // particles
    for (const pt of world.particles) {
      ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // enemies
    for (const e of world.enemies) {
      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(e.x, e.y + e.radius * 0.7, e.radius * 0.9, e.radius * 0.4, 0, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : (e.brute ? '#ff8a5c' : '#ff5d7e');
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2; ctx.stroke();

      // eyes (face the player)
      const [fx, fy] = norm(world.player.x - e.x, world.player.y - e.y);
      ctx.fillStyle = '#0d0f14';
      ctx.beginPath(); ctx.arc(e.x + fx * 4 - fy * 4, e.y + fy * 4 + fx * 4, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x + fx * 4 + fy * 4, e.y + fy * 4 - fx * 4, 2.4, 0, Math.PI * 2); ctx.fill();

      // hp bar
      if (e.hp < e.maxHp) {
        const w = e.radius * 2;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x - w / 2, e.y - e.radius - 9, w, 4);
        ctx.fillStyle = '#7affb0';
        ctx.fillRect(e.x - w / 2, e.y - e.radius - 9, w * (e.hp / e.maxHp), 4);
      }
    }

    // bullets
    ctx.fillStyle = '#ffd24a';
    for (const b of world.bullets) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.fillStyle = 'rgba(255,210,74,0.25)';
      ctx.fillRect(-14, -2, 14, 4);
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // player
    drawPlayer();

    ctx.restore();

    // between-wave banner
    if (world.spawnQueue <= 0 && world.enemies.length === 0 && world.wave > 0) {
      ctx.fillStyle = 'rgba(255,210,74,0.9)';
      ctx.font = '600 22px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Wave ' + (world.wave + 1) + ' incoming…', view.w / 2, view.h * 0.32);
    }
  }

  function drawArena() {
    // floor
    ctx.fillStyle = '#11141b';
    ctx.fillRect(0, 0, ARENA.w, ARENA.h);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    const grid = 80;
    const x0 = Math.floor(cam.x / grid) * grid;
    const y0 = Math.floor(cam.y / grid) * grid;
    ctx.beginPath();
    for (let x = x0; x < cam.x + view.w; x += grid) { ctx.moveTo(x, cam.y); ctx.lineTo(x, cam.y + view.h); }
    for (let y = y0; y < cam.y + view.h; y += grid) { ctx.moveTo(cam.x, y); ctx.lineTo(cam.x + view.w, y); }
    ctx.stroke();

    // border
    ctx.strokeStyle = 'rgba(74,214,255,0.25)';
    ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, ARENA.w - 4, ARENA.h - 4);
  }

  function drawPlayer() {
    const p = world.player;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + p.radius * 0.7, p.radius, p.radius * 0.45, 0, 0, Math.PI * 2); ctx.fill();

    // aim line
    ctx.strokeStyle = 'rgba(74,214,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + p.aim[0] * 60, p.y + p.aim[1] * 60);
    ctx.stroke();

    // body
    ctx.fillStyle = p.hitFlash > 0 ? '#ffffff' : '#4ad6ff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.stroke();

    // barrel
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.atan2(p.aim[1], p.aim[0]));
    ctx.fillStyle = '#07121a';
    ctx.fillRect(p.radius - 4, -4, 16, 8);
    ctx.restore();
  }

  // --- Game loop --------------------------------------------------------------
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (state !== 'playing') { last = now; return; }
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05; // clamp big stalls

    const input = sampleInput();
    updateCamera();
    step(dt, input);
    if (state === 'playing') render();
  }
  requestAnimationFrame(frame);

  // --- State transitions ------------------------------------------------------
  function startGame() {
    world = newWorld();
    state = 'playing';
    last = performance.now();
    ui.overlay.classList.add('hidden');
    ui.healthFill.style.width = '100%';
    ui.score.textContent = '0';
    ui.wave.textContent = '1';
  }

  function gameOver() {
    state = 'dead';
    ui.title.innerHTML = 'You <span style="color:#ff4d6d">fell</span>';
    ui.subtitle.textContent = 'The arena always wins eventually. Try again?';
    ui.finalScore.classList.remove('hidden');
    ui.finalScore.innerHTML = `Reached <b>Wave ${world.wave}</b> · Score <b>${world.score}</b>`;
    ui.startBtn.textContent = 'Re-enter Arena';
    ui.overlay.classList.remove('hidden');
  }

  ui.startBtn.addEventListener('click', startGame);

  // touch hint text
  if (isTouch) {
    ui.hint.innerHTML = 'Left stick to move &nbsp;·&nbsp; right stick to aim &amp; fire';
    ui.hudRight.textContent = '';
  } else {
    ui.hudRight.innerHTML = 'WASD · mouse aim<br>hold to fire';
  }
})();
</script>
</body>
</html>
