<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Homesick - Connect</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface-2: #1a1a1a;
      --surface-3: #222222;
      --border: #2a2a2a;
      --border-focus: #444444;
      --text: #f0f0f0;
      --text-secondary: #888888;
      --text-tertiary: #555555;
      --accent: #d4d4d4;
      --success: #4ade80;
      --success-dim: #4ade8020;
      --error: #f87171;
      --error-dim: #f8717120;
      --warning: #fbbf24;
      --warning-dim: #fbbf2420;
      --blue: #60a5fa;
      --blue-dim: #60a5fa15;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .app {
      max-width: 420px;
      margin: 0 auto;
      padding: 0 20px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* --- Header --- */
    .header {
      padding: 48px 0 32px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 16px;
    }

    .title {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text);
    }

    .title span {
      color: var(--text-tertiary);
    }

    .device-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 6px 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .device-tag .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-tertiary);
      transition: background 0.3s;
    }

    .device-tag .dot.searching { animation: pulse 1.5s infinite; background: var(--warning); }
    .device-tag .dot.connected { background: var(--success); }
    .device-tag .dot.error { background: var(--error); }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* --- Sections --- */
    .section {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }

    .section:last-of-type {
      border-bottom: none;
    }

    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 16px;
    }

    /* --- Connect Button --- */
    .connect-btn {
      width: 100%;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .connect-btn:hover {
      background: var(--surface-2);
      border-color: var(--border-focus);
    }

    .connect-btn:active {
      transform: scale(0.99);
    }

    .connect-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .connect-btn .icon {
      width: 16px;
      height: 16px;
      opacity: 0.6;
    }

    .connect-btn.connected {
      border-color: var(--success);
      background: var(--success-dim);
    }

    /* --- Input Fields --- */
    .field {
      margin-bottom: 16px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field-input:focus {
      border-color: var(--border-focus);
    }

    .field-input::placeholder {
      color: var(--text-tertiary);
    }

    .field-input-wrap {
      position: relative;
    }

    .field-input-wrap .field-input {
      padding-right: 44px;
    }

    .toggle-vis {
      position: absolute;
      right: 1px;
      top: 1px;
      bottom: 1px;
      width: 42px;
      background: transparent;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0 6px 6px 0;
      transition: color 0.2s;
    }

    .toggle-vis:hover { color: var(--text-secondary); }

    /* --- Network List --- */
    .network-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .network-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .network-item:hover {
      background: var(--surface-2);
      border-color: var(--border-focus);
    }

    .network-item.selected {
      border-color: var(--accent);
      background: var(--surface-2);
    }

    .network-name {
      font-size: 13px;
      font-weight: 400;
    }

    .network-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .signal-bars {
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 12px;
    }

    .signal-bars .bar {
      width: 3px;
      background: var(--text-tertiary);
      border-radius: 1px;
      transition: background 0.2s;
    }

    .signal-bars .bar.active { background: var(--text-secondary); }

    .network-lock {
      width: 12px;
      height: 12px;
      color: var(--text-tertiary);
    }

    .manual-toggle {
      font-size: 11px;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 8px 0;
      text-align: center;
      transition: color 0.2s;
    }

    .manual-toggle:hover { color: var(--text-secondary); }

    /* --- Send Button --- */
    .send-btn {
      width: 100%;
      padding: 16px;
      background: var(--text);
      border: none;
      border-radius: 6px;
      color: var(--bg);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .send-btn:hover {
      opacity: 0.9;
    }

    .send-btn:active {
      transform: scale(0.99);
    }

    .send-btn:disabled {
      background: var(--surface-3);
      color: var(--text-tertiary);
      cursor: not-allowed;
    }

    /* --- Status Log --- */
    .status-log {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-entry {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.5;
      color: var(--text-tertiary);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .log-entry .log-time {
      color: var(--text-tertiary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-entry .log-msg { color: var(--text-secondary); }
    .log-entry.success .log-msg { color: var(--success); }
    .log-entry.error .log-msg { color: var(--error); }
    .log-entry.info .log-msg { color: var(--blue); }

    /* --- Result Card --- */
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      text-align: center;
      display: none;
    }

    .result-card.visible { display: block; }

    .result-card.success-card {
      border-color: #4ade8040;
      background: var(--success-dim);
    }

    .result-card.error-card {
      border-color: #f8717140;
      background: var(--error-dim);
    }

    .result-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .result-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .result-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* --- Footer --- */
    .footer {
      margin-top: auto;
      padding: 24px 0;
      text-align: center;
    }

    .footer-text {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    .footer-text a {
      color: var(--text-tertiary);
      text-decoration: none;
    }

    /* --- Screens --- */
    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; flex: 1; }

    /* --- Spinner --- */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- Scan animation --- */
    .scan-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 40px auto 24px;
      position: relative;
    }

    .scan-ring::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid var(--border);
      opacity: 0.5;
    }

    .scan-ring::after {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      border: 1px solid var(--border);
      opacity: 0.25;
    }

    .scan-ring.scanning::before { animation: ringPulse 2s ease-out infinite; }
    .scan-ring.scanning::after { animation: ringPulse 2s ease-out infinite 0.4s; }

    @keyframes ringPulse {
      0% { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    .scan-ring svg {
      width: 36px;
      height: 36px;
      color: var(--text-tertiary);
    }

    .scan-text {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .scan-text .hint {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }

    /* --- No BLE fallback --- */
    .no-ble-notice {
      padding: 16px;
      background: var(--warning-dim);
      border: 1px solid #fbbf2430;
      border-radius: 6px;
      font-size: 12px;
      color: var(--warning);
      line-height: 1.6;
      text-align: center;
    }

    /* --- Quick Connect --- */
    .quick-connect-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid var(--success);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease;
    }

    .quick-connect-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .quick-connect-ssid {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
    }

    .saved-badge {
      font-size: 9px;
      font-weight: 500;
      padding: 2px 6px;
      background: var(--success-dim);
      color: var(--success);
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .quick-connect-btn {
      padding: 12px 16px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .quick-connect-btn svg {
      width: 14px;
      height: 14px;
    }

    /* --- Saved Networks Management --- */
    .saved-network-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 4px;
    }

    .saved-network-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .saved-network-name {
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-secondary);
    }

    .saved-network-time {
      font-size: 10px;
      color: var(--text-tertiary);
    }

    .forget-btn {
      font-size: 10px;
      font-family: 'Inter', sans-serif;
      color: var(--text-tertiary);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .forget-btn:hover { color: var(--error); }

    .section-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-label-row .section-label {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- ========== SCREEN 1: CONNECT ========== -->
    <div class="screen active" id="screenConnect">
      <div class="header">
        <div class="brand">Homesick</div>
        <div class="title">Connect <span>your device</span></div>
        <div class="device-tag">
          <div class="dot" id="statusDot"></div>
          <span id="deviceId">no device</span>
        </div>
      </div>

      <div class="section">
        <div class="section-label">01 / Device</div>
        <div id="bleSupport"></div>
        <button class="connect-btn" id="connectBtn" onclick="scanForDevice()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/>
          </svg>
          Scan for device
        </button>
      </div>

      <div class="section" id="wifiSection" style="display:none">
        <div class="section-label">02 / Network</div>

        <div id="quickConnectCard" class="quick-connect-card" style="display:none">
          <div class="quick-connect-header">
            <span class="quick-connect-ssid" id="quickConnectSSID"></span>
            <span class="saved-badge">saved</span>
          </div>
          <button class="send-btn quick-connect-btn" id="quickConnectBtn" onclick="quickConnect()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            Quick connect
          </button>
        </div>

        <div id="networkListContainer" style="display:none">
          <div class="network-list" id="networkList"></div>
          <div class="manual-toggle" onclick="toggleManualEntry()">Enter manually</div>
        </div>

        <div id="manualEntry">
          <div class="field">
            <div class="field-label">SSID</div>
            <input class="field-input" type="text" id="ssidInput" placeholder="Network name" autocomplete="off" autocapitalize="off" />
          </div>
        </div>

        <div class="field">
          <div class="field-label">
            Password
            <span id="securityType" style="font-size:10px;color:var(--text-tertiary)"></span>
          </div>
          <div class="field-input-wrap">
            <input class="field-input" type="password" id="passInput" placeholder="Network password" autocomplete="off" />
            <button class="toggle-vis" onclick="togglePassword()" aria-label="Toggle password visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="send-btn" id="sendBtn" onclick="sendCredentials()" disabled>
          Send credentials
        </button>
      </div>

      <div class="section" id="logSection" style="display:none">
        <div class="section-label">Log</div>
        <div class="status-log" id="statusLog"></div>
      </div>

      <div class="section" id="savedNetworksSection" style="display:none">
        <div class="section-label-row">
          <div class="section-label">Saved networks</div>
          <button class="forget-btn" onclick="forgetAllNetworks()">Clear all</button>
        </div>
        <div id="savedNetworksList"></div>
      </div>

      <div id="resultCard" class="result-card">
        <div class="result-icon" id="resultIcon"></div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-sub" id="resultSub"></div>
      </div>

      <div class="footer">
        <div class="footer-text">Homesick &mdash; objects for elsewhere</div>
      </div>
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    const BLE_SERVICE_UUID   = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const BLE_CHAR_SSID_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
    const BLE_CHAR_PASS_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a9';
    const BLE_CHAR_CMD_UUID  = 'beb5483e-36e1-4688-b7f5-ea07361b26aa';
    const BLE_CHAR_STATUS_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26ab';
    const BLE_CHAR_SCAN_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26ac';

    // ===== STATE =====
    let bleDevice = null;
    let bleServer = null;
    let bleService = null;
    let charSSID = null;
    let charPass = null;
    let charCmd = null;
    let charStatus = null;
    let charScan = null;
    let selectedSSID = '';
    let quickConnectData = null;

    // ===== SAVED NETWORKS =====
    const STORAGE_KEY = 'homesick_saved_networks';

    function getSavedNetworks() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (!data) return [];
        return JSON.parse(data).sort((a, b) => b.lastUsed - a.lastUsed);
      } catch (e) { return []; }
    }

    function saveNetwork(ssid, password) {
      try {
        const networks = getSavedNetworks();
        const idx = networks.findIndex(n => n.ssid === ssid);
        const entry = { ssid, password, lastUsed: Date.now() };
        if (idx >= 0) networks[idx] = entry;
        else networks.push(entry);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(networks));
        renderSavedNetworks();
      } catch (e) {}
    }

    function getSavedPassword(ssid) {
      const net = getSavedNetworks().find(n => n.ssid === ssid);
      return net ? net.password : null;
    }

    function forgetNetwork(ssid) {
      try {
        const networks = getSavedNetworks().filter(n => n.ssid !== ssid);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(networks));
        renderSavedNetworks();
      } catch (e) {}
    }

    function forgetAllNetworks() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      renderSavedNetworks();
    }

    function renderSavedNetworks() {
      const section = document.getElementById('savedNetworksSection');
      const list = document.getElementById('savedNetworksList');
      const networks = getSavedNetworks();

      if (networks.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = '';
      list.innerHTML = networks.map(n => {
        const ago = timeAgo(n.lastUsed);
        return `
          <div class="saved-network-item">
            <div class="saved-network-info">
              <span class="saved-network-name">${esc(n.ssid)}</span>
              <span class="saved-network-time">${ago}</span>
            </div>
            <button class="forget-btn" onclick="forgetNetwork('${esc(n.ssid).replace(/'/g, "\\'")}')">Forget</button>
          </div>`;
      }).join('');
    }

    function timeAgo(ts) {
      const diff = Date.now() - ts;
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      const days = Math.floor(hrs / 24);
      return days + 'd ago';
    }

    // ===== INIT =====
    const params = new URLSearchParams(window.location.search);
    const deviceParam = params.get('device') || params.get('d');
    if (deviceParam) {
      document.getElementById('deviceId').textContent = deviceParam;
    }

    // Check BLE support
    const bleSupported = !!navigator.bluetooth;
    if (!bleSupported) {
      document.getElementById('bleSupport').innerHTML =
        '<div class="no-ble-notice">Web Bluetooth is not supported in this browser. Use Chrome on Android, or Bluefy on iOS.</div>';
      document.getElementById('connectBtn').disabled = true;
    }

    // ===== BLE CONNECTION =====
    async function scanForDevice() {
      const btn = document.getElementById('connectBtn');
      const dot = document.getElementById('statusDot');

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Scanning...';
      dot.className = 'dot searching';
      log('Requesting BLE device...');

      try {
        const options = {
          filters: [{ services: [BLE_SERVICE_UUID] }],
          optionalServices: [BLE_SERVICE_UUID]
        };

        // If device param specified, also filter by name prefix
        if (deviceParam) {
          options.filters.push({ namePrefix: deviceParam });
        }

        bleDevice = await navigator.bluetooth.requestDevice(options);
        log(`Found: ${bleDevice.name || 'unnamed'}`, 'info');
        document.getElementById('deviceId').textContent = bleDevice.name || bleDevice.id.slice(0, 12);

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        log('Connecting GATT server...');
        bleServer = await bleDevice.gatt.connect();

        log('Discovering service...');
        bleService = await bleServer.getPrimaryService(BLE_SERVICE_UUID);

        // Get characteristics
        charSSID = await bleService.getCharacteristic(BLE_CHAR_SSID_UUID);
        charPass = await bleService.getCharacteristic(BLE_CHAR_PASS_UUID);
        charCmd  = await bleService.getCharacteristic(BLE_CHAR_CMD_UUID);

        // Optional characteristics (scan, status)
        try {
          charStatus = await bleService.getCharacteristic(BLE_CHAR_STATUS_UUID);
          await charStatus.startNotifications();
          charStatus.addEventListener('characteristicvaluechanged', onStatusUpdate);
        } catch (e) {
          charStatus = null;
        }

        try {
          charScan = await bleService.getCharacteristic(BLE_CHAR_SCAN_UUID);
        } catch (e) {
          charScan = null;
        }

        dot.className = 'dot connected';
        btn.innerHTML = `
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Connected`;
        btn.classList.add('connected');
        log('Connected', 'success');

        // Show WiFi section
        document.getElementById('wifiSection').style.display = '';
        updateSendBtn();

        // Try scanning for networks
        if (charScan) {
          await scanNetworks();
        }

      } catch (err) {
        dot.className = 'dot error';
        btn.disabled = false;
        btn.innerHTML = `
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/>
          </svg>
          Retry scan`;
        log(`${err.message}`, 'error');
      }
    }

    async function scanNetworks() {
      log('Scanning WiFi networks...');
      try {
        // Send scan command
        const encoder = new TextEncoder();
        await charCmd.writeValue(encoder.encode('SCAN'));

        // Wait briefly then read results
        await delay(3000);
        const value = await charScan.readValue();
        const decoder = new TextDecoder();
        const raw = decoder.decode(value);

        if (raw && raw.trim()) {
          const networks = raw.split('\n').filter(Boolean).map(line => {
            const parts = line.split(',');
            return {
              ssid: parts[0] || '',
              rssi: parseInt(parts[1]) || -100,
              secure: parts[2] !== '0'
            };
          }).filter(n => n.ssid);

          if (networks.length > 0) {
            renderNetworks(networks);
            log(`Found ${networks.length} network${networks.length > 1 ? 's' : ''}`, 'info');
            return;
          }
        }
      } catch (e) {
        // Scan not supported or failed, fall back to manual
      }
      log('Manual SSID entry mode');
    }

    function renderNetworks(networks) {
      const container = document.getElementById('networkListContainer');
      const list = document.getElementById('networkList');
      const manual = document.getElementById('manualEntry');
      const saved = getSavedNetworks();

      container.style.display = '';
      manual.style.display = 'none';

      list.innerHTML = networks.map(n => {
        const bars = signalBars(n.rssi);
        const isSaved = saved.some(s => s.ssid === n.ssid);
        return `
          <div class="network-item" data-ssid="${esc(n.ssid)}" data-secure="${n.secure}" onclick="selectNetworkEl(this)">
            <span class="network-name">${esc(n.ssid)}${isSaved ? ' <span class="saved-badge">saved</span>' : ''}</span>
            <div class="network-meta">
              <div class="signal-bars">
                <div class="bar ${bars >= 1 ? 'active' : ''}" style="height:3px"></div>
                <div class="bar ${bars >= 2 ? 'active' : ''}" style="height:6px"></div>
                <div class="bar ${bars >= 3 ? 'active' : ''}" style="height:9px"></div>
                <div class="bar ${bars >= 4 ? 'active' : ''}" style="height:12px"></div>
              </div>
              ${n.secure ? '<svg class="network-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>' : ''}
            </div>
          </div>`;
      }).join('');

      checkForQuickConnect(networks);
    }

    function selectNetworkEl(el) {
      const ssid = el.dataset.ssid;
      const secure = el.dataset.secure === 'true';
      document.querySelectorAll('.network-item').forEach(n => n.classList.remove('selected'));
      el.classList.add('selected');
      selectedSSID = ssid;
      document.getElementById('securityType').textContent = secure ? 'WPA2' : 'Open';

      // Pre-fill saved password
      const savedPass = getSavedPassword(ssid);
      if (savedPass !== null) {
        document.getElementById('passInput').value = savedPass;
      }

      document.getElementById('passInput').focus();
      updateSendBtn();
    }

    function checkForQuickConnect(networks) {
      const saved = getSavedNetworks();
      const card = document.getElementById('quickConnectCard');

      for (const s of saved) {
        if (networks.some(n => n.ssid === s.ssid)) {
          quickConnectData = { ssid: s.ssid, password: s.password };
          document.getElementById('quickConnectSSID').textContent = s.ssid;
          card.style.display = '';
          return;
        }
      }

      quickConnectData = null;
      card.style.display = 'none';
    }

    function quickConnect() {
      if (!quickConnectData) return;
      selectedSSID = quickConnectData.ssid;
      document.getElementById('passInput').value = quickConnectData.password;
      sendCredentials();
    }

    function toggleManualEntry() {
      const manual = document.getElementById('manualEntry');
      const list = document.getElementById('networkListContainer');
      const isManual = manual.style.display !== 'none';
      manual.style.display = isManual ? 'none' : '';
      list.style.display = isManual ? '' : 'none';
      if (!isManual) {
        selectedSSID = '';
        document.getElementById('ssidInput').focus();
      }
      updateSendBtn();
    }

    function signalBars(rssi) {
      if (rssi > -50) return 4;
      if (rssi > -65) return 3;
      if (rssi > -80) return 2;
      return 1;
    }

    // ===== SEND CREDENTIALS =====
    async function sendCredentials() {
      const ssid = selectedSSID || document.getElementById('ssidInput').value.trim();
      const pass = document.getElementById('passInput').value;
      const btn = document.getElementById('sendBtn');

      if (!ssid) return;

      btn.disabled = true;
      btn.textContent = 'Sending...';
      log(`Sending credentials for "${ssid}"...`);

      try {
        const encoder = new TextEncoder();

        // Write SSID
        await charSSID.writeValue(encoder.encode(ssid));
        log('SSID written', 'info');

        // Write password
        await charPass.writeValue(encoder.encode(pass));
        log('Password written', 'info');

        // Send connect command
        await charCmd.writeValue(encoder.encode('CONNECT'));
        log('Connect command sent', 'info');

        // Wait for status if available
        if (charStatus) {
          btn.textContent = 'Waiting for connection...';
          log('Waiting for device to connect to WiFi...');

          // The status characteristic will fire notifications
          // We also poll as fallback
          let attempts = 0;
          const maxAttempts = 15;
          while (attempts < maxAttempts) {
            await delay(1000);
            try {
              const val = await charStatus.readValue();
              const status = new TextDecoder().decode(val);

              if (status.startsWith('OK')) {
                const ip = status.split(':')[1] || '';
                showResult('success', 'Connected', ip ? `IP: ${ip}` : 'Device is online');
                log(`WiFi connected${ip ? ` - IP: ${ip}` : ''}`, 'success');
                saveNetwork(ssid, pass);
                btn.textContent = 'Done';
                return;
              } else if (status.startsWith('FAIL')) {
                showResult('error', 'Connection failed', 'Check credentials and try again');
                log('WiFi connection failed', 'error');
                btn.disabled = false;
                btn.textContent = 'Retry';
                return;
              }
            } catch (e) {
              // Read failed, keep trying
            }
            attempts++;
          }

          // Timeout
          showResult('error', 'Timeout', 'No response from device');
          log('Connection timed out', 'error');
        } else {
          // No status char, optimistic
          showResult('success', 'Credentials sent', 'Check your device for connection status');
          log('Credentials sent (no status feedback)', 'success');
          saveNetwork(ssid, pass);
        }

        btn.textContent = 'Done';

      } catch (err) {
        log(`Send failed: ${err.message}`, 'error');
        showResult('error', 'Send failed', err.message);
        btn.disabled = false;
        btn.textContent = 'Retry';
      }
    }

    // ===== STATUS UPDATES =====
    function onStatusUpdate(event) {
      const val = new TextDecoder().decode(event.target.value);
      log(`Device: ${val}`, val.startsWith('OK') ? 'success' : val.startsWith('FAIL') ? 'error' : 'info');
    }

    function onDisconnected() {
      const dot = document.getElementById('statusDot');
      const btn = document.getElementById('connectBtn');
      dot.className = 'dot';
      btn.classList.remove('connected');
      btn.disabled = false;
      btn.innerHTML = `
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/>
        </svg>
        Reconnect`;
      log('Device disconnected', 'error');
      document.getElementById('wifiSection').style.display = 'none';
    }

    // ===== UI HELPERS =====
    function togglePassword() {
      const input = document.getElementById('passInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function updateSendBtn() {
      const ssid = selectedSSID || document.getElementById('ssidInput').value.trim();
      const connected = bleServer && bleServer.connected;
      document.getElementById('sendBtn').disabled = !(ssid && connected);
    }

    function showResult(type, title, sub) {
      const card = document.getElementById('resultCard');
      card.className = `result-card visible ${type === 'success' ? 'success-card' : 'error-card'}`;
      document.getElementById('resultIcon').textContent = type === 'success' ? '\u2713' : '\u2717';
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultSub').textContent = sub;
    }

    function log(msg, type = '') {
      const logEl = document.getElementById('statusLog');
      document.getElementById('logSection').style.display = '';
      const time = new Date().toLocaleTimeString('en', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerHTML = `<span class="log-time">${time}</span> <span class="log-msg">${esc(msg)}</span>`;
      logEl.appendChild(entry);
      entry.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function delay(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    // Input listeners
    document.getElementById('ssidInput').addEventListener('input', updateSendBtn);
    document.getElementById('passInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendCredentials();
    });

    // Init saved networks
    renderSavedNetworks();
  </script>
</body>
</html>
